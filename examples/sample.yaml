  - type: scope
    scope:
      title: Scope
      in_scope:
        - Standard purchase invoices received in the shared mailbox
        - Data extraction, validation against SOP rules, record creation and closure
        - Routing of exceptions to the manual queue
      out_scope:
        - Handwritten and non-standard document types
        - Nested SOPs and multi-step approvals
        - Downstream payment processing
      note: Scope changes after BRD sign-off follow change control.
