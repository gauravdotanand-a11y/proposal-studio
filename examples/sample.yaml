slides:
  - type: title
  - type: flow
    flow:
      title: HL Flow of Automation
      nodes:
        - {id: bot, label: Bot picks next item, kind: bot}
        - {id: get, label: Get extracted data}
        - {id: create, label: Create record in target app}
        - {id: ok, label: "Record created?", kind: decision}
        - {id: manual, label: Move to manual queue, kind: human}
        - {id: validate, label: Validate and process per SOP}
        - {id: closed, label: "Closed successfully?", kind: decision}
        - {id: report, label: Create daily report, kind: end}
      edges:
        - {src: bot, dst: get}
        - {src: get, dst: create}
        - {src: create, dst: ok}
        - {src: ok, dst: manual, label: "No"}
        - {src: ok, dst: validate, label: "Yes"}
        - {src: validate, dst: closed}
        - {src: closed, dst: manual, label: "No"}
        - {src: closed, dst: report, label: "Yes"}
      notes:
        - Success rate depends on data extracted from documents.
  - type: assumptions
    assumptions:
      items:
        - The bot only retrieves details from the data source and creates records.
        - Extracted data is provided by the GenAI team.
        - Unhandled validation errors move the record to the manual queue.
        - Test data and lower-environment access will be provided.
