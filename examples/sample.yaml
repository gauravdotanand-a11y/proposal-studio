        - {risk: Lower environment not in sync with production, impact: Medium, mitigation: Agree test data and sync plan before UAT}
        - {risk: SME availability during UAT, impact: Medium, mitigation: Book SME slots in the plan; daily feedback call}
        - {risk: Licence cost differs from estimate, impact: Low, mitigation: Re-baseline after infrastructure sizing}
