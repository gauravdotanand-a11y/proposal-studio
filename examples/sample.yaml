  - type: solution
    solution:
      title: Invoice intake using OCR and Generative AI
      stages:
        - {heading: Input Sources, title: "Mailbox + Document store", body: "Scanned invoices and PDFs"}
        - {heading: ML / GenAI, title: Extract fields, body: "OCR + LLM structure the data", ai: true}
        - {heading: Central Storage, title: Database, body: "Extracted data and history"}
        - {heading: Rule Engine, title: Validate, body: "Checks against SOP rules"}
        - {heading: UI / UX, title: Analyst review, body: "Override or confirm values"}
        - {heading: Automation, title: RPA bot, body: "Creates records and closes"}
      blocks:
        - {heading: Solution, text: "Automate and streamline invoice data entry using OCR, GenAI and RPA so the process becomes faster, accurate and SOP compliant."}
        - {heading: In-scope volume, text: "Phase 1: standard purchase invoices."}
        - {heading: Infrastructure need, text: "LLM service, SQL database, blob storage, RPA licences."}
      steps:
        - {label: Fetch, text: API opens the document from the store.}
        - {label: Extract, text: ML/GenAI extracts and structures the data.}
        - {label: Validate, text: Rule engine checks values against SOPs.}
        - {label: Review, text: Analyst verifies flagged items if needed.}
        - {label: Automate, text: RPA creates and closes the record.}
